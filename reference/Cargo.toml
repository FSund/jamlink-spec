[package]
name = "jamlink"
version = "0.1.0"
edition = "2024"
description = "Jamlink 1.0 reference implementation and conformance test peer"
license = "MIT-0"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
jsonschema = "0.60.2"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
